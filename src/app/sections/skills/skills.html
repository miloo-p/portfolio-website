<section class="skills" id="skills">
  <div class="skills__wrapper">
    <div class="skills__header">
      <h2>{{ 'SKILLS.TITLE' | translate }}</h2>
      <p class="skills__header__subtext subtitle">{{ 'SKILLS.SUBTITLE' | translate }}</p>
    </div>

    <div class="skills__grid">
      @for (skill of mySkills; track skill.name) {
        <div class="skills__item">
          <img [src]="skill.iconUrl" [alt]="skill.name" class="skills__icon" />
          <span class="skills__name" aria-hidden="true">{{ skill.name }}</span>
        </div>
      }
    </div>
  </div>
</section>
